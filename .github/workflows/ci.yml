name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 同一分支的新推送取消旧运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - run: flutter pub get

      # 1) format 门禁：代码必须已按 dart format 规范化
      - name: format check
        run: dart format --set-exit-if-changed lib test tool

      # 2) architecture 门禁：分层依赖规则（独立于 analyze/test 快速失败）
      - name: architecture boundaries
        run: dart run tool/check_import_boundaries.dart

      # 3) analyze 门禁：静态分析零告警
      - name: analyze
        run: flutter analyze

      # 4) version hook 契约验证（不依赖 flutter，快速失败）
      - name: verify version hook
        run: bash scripts/verify-version-hook.sh

      # 5) test 门禁：运行必要测试，保留完整日志和真实退出码
      - name: test
        run: |
          set +e
          flutter test --reporter compact > fltest.log 2>&1
          CODE=$?
          set -e
          echo "EXIT=$CODE" >> fltest.log
          tail -n 150 fltest.log
          exit $CODE

      # 6) 失败时仍上传完整日志，便于从 fltest.log 查失败摘要
      - name: upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: fltest.log
          retention-days: 14
