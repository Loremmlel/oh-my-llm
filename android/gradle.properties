org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
android.useAndroidX=true
# 通过构建 JVM 传递给 Flutter SDK 自带的独立 Gradle 插件工程。
systemProp.org.gradle.project.kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# 显式启用新 DSL，避免 Flutter 3.50 迁移器追加旧 DSL 配置。
android.newDsl=true
